<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle Defense</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="app"><div class="frame">
<div id="ttl">Castle Defense</div>
<div id="wrap"><canvas id="c"></canvas>
<div class="res"><div class="slot"><i>🪙</i><span id="gold"></span></div><div class="slot"><i>🏰</i><span id="lives"></span></div><div class="slot"><i>⚔️</i><span id="wave"></span></div></div>
<div id="zm"><button id="zi">+</button><button id="zo">&minus;</button><button id="zr">&#10227;</button><button id="mu" title="Music">&#9835;</button><button id="sf" title="Sound effects">&#128266;</button></div>
<canvas id="mm" width="200" height="86"></canvas><div id="ov"></div></div>
<div id="panel"><div id="towers"></div>
<div id="ip"><div id="info"></div><div id="sel"><button class="wb" id="up"></button><button class="wb" id="sell"></button></div></div>
<div id="act"><button class="wb go" id="start">Start wave</button><button class="wb" id="spd">×1</button></div></div>
<p class="h">1–8 pick a defender · Space starts the wave · Drag to rotate the camera (Q/E) · Scroll or pinch to zoom · Right-drag or two fingers to pan · Click the minimap to jump there</p>
</div></div>
